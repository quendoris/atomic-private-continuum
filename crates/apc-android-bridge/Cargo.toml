[package]
name = "apc-android-bridge"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Narrow Android/JNI lifecycle and recovery bridge for Atomic Private Continuum"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
apc-core = { path = "../apc-core" }
apc-crypto = { path = "../apc-crypto" }
apc-runtime = { path = "../apc-runtime" }
apc-storage-fs = { path = "../apc-storage-fs" }
apc-sync = { path = "../apc-sync" }
jni = "0.21.1"

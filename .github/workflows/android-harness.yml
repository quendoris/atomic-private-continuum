name: android-harness

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/apc-core/**"
      - "crates/apc-crypto/**"
      - "crates/apc-runtime/**"
      - "crates/apc-storage-fs/**"
      - "crates/apc-sync/**"
      - "crates/apc-android-bridge/**"
      - "android/harness/**"
      - "tools/build-android-bridge.sh"
      - ".github/workflows/android-harness.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/apc-core/**"
      - "crates/apc-crypto/**"
      - "crates/apc-runtime/**"
      - "crates/apc-storage-fs/**"
      - "crates/apc-sync/**"
      - "crates/apc-android-bridge/**"
      - "android/harness/**"
      - "tools/build-android-bridge.sh"
      - ".github/workflows/android-harness.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "ndk;28.2.13676358"

      - name: Install Rust Android tooling
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Build Rust JNI bridge
        shell: bash
        run: ./tools/build-android-bridge.sh

      - name: Assemble debug APK
        working-directory: android/harness
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apc-android-harness-debug
          path: android/harness/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
